# Redefine 主题覆盖配置
# Hexo 会将本文件与 node_modules/hexo-theme-redefine/_config.yml 深度合并，
# 此处仅写需要覆盖的项。文档：https://redefine-docs.ohevan.com

# 基本信息
info:
  title: laimanxi
  subtitle: 这里好像空空的
  author: laimanxi
  url: https://laimanxi.github.io

# 图片
defaults:
  favicon: /img/favicon.svg
  avatar: /img/favicon.svg

# 首页横幅
home_banner:
  title: laimanxi
  subtitle:
    # 打字机副标题已被自定义揭示文字替代（source/js/custom.js），此处置空。
    # 你之前写的句子留档，以后想恢复打字机效果把 text 换成它们即可：
    # - 喂喂喂，有人吗
    # - 偶尔回望，常常驻足，总是向前
    # - 看到这句话的都是傻子
    # - 持续更新，欢迎关注
    # - 邀请你一起拉屎
    text: []
  social_links:
    enable: true
    links:
      - icon: github
        url: https://github.com/laimanxi

# 自定义 CSS/JS 注入（首页横幅特效）
# 注意：修改 custom.css / custom.js 后，把下面 URL 里的 v= 数字 +1，
# 强制浏览器加载新版本，避免缓存旧文件
inject:
  enable: true
  head:
    - <link rel="stylesheet" href="/css/custom.css?v=15">
  footer:
    - <script src="/js/custom.js?v=14" defer></script>

# 导航栏
navbar:
  links:
    Home:
      path: /
      icon: fa-regular fa-house
    Archives:
      path: /archives
      icon: fa-regular fa-archive
    Tags:
      path: /tags
      icon: fa-regular fa-tags
    Categories:
      path: /categories
      icon: fa-regular fa-folder
    About:
      path: /about
      icon: fa-regular fa-user
  # 本地搜索，依赖 hexo-generator-searchdb（已安装）
  search:
    enable: true
    preload: true

# 首页侧边栏
home:
  sidebar:
    links:
      Archives:
        path: /archives
        icon: fa-regular fa-archive
      Tags:
        path: /tags
        icon: fa-regular fa-tags
      Categories:
        path: /categories
        icon: fa-regular fa-folder

# 全局
global:
  open_graph:
    description: 这里是 laimanxi 的地盘，天干物燥，小心火烛

# 评论（Giscus，基于 GitHub Discussions）
comment:
  enable: true
  system: giscus
  config:
    giscus:
      repo: laimanxi/laimanxi.github.io
      repo_id: R_kgDORRNjxg
      category: General
      category_id: DIC_kwDORRNjxs4DCxOj
      mapping: pathname
      strict: 1
      reactions_enabled: 1
      emit_metadata: 0
      lang: zh-CN
      input_position: top
      loading: lazy

# 页脚
footer:
  # 建站时间取第一篇文章日期
  start: 2025/10/03 00:00:00
